<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Solid, not black-translucent: translucent leaves the iOS 27 Home Screen web view one status bar short.
       iOS reads this only when the icon is added. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Remote">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.webmanifest">
  <title>MyRemote</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>

    <symbol id="i-updown" viewBox="0 0 24 24"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></symbol>
    <symbol id="i-touchpad" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="M2 14h20"/><path d="M12 20v-6"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><path d="M10 8h.01"/><path d="M12 12h.01"/><path d="M14 8h.01"/><path d="M16 12h.01"/><path d="M18 8h.01"/><path d="M6 8h.01"/><path d="M7 16h10"/><path d="M8 12h.01"/><rect width="20" height="16" x="2" y="4" rx="2"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
    <symbol id="i-presentation" viewBox="0 0 24 24"><path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/></symbol>
    <symbol id="i-skip-back" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/></symbol>
    <symbol id="i-skip-forward" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/></symbol>
    <symbol id="i-play-pause" viewBox="0 0 24 24"><polygon points="2.5 5 11.5 12 2.5 19 2.5 5"/><rect x="14.5" y="5" width="2.5" height="14" rx=".75"/><rect x="19.5" y="5" width="2.5" height="14" rx=".75"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>

    <symbol id="i-volume-2" viewBox="0 0 24 24"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></symbol>
    <symbol id="i-volume-x" viewBox="0 0 24 24"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></symbol>
    <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></symbol>

    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></symbol>
    <symbol id="i-mic-off" viewBox="0 0 24 24"><line x1="2" x2="22" y1="2" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" x2="12" y1="19" y2="22"/></symbol>
    <symbol id="i-pointer" viewBox="0 0 24 24"><path d="M22 14a8 8 0 0 1-8 8"/><path d="M18 11v-1a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V9a2 2 0 0 0-2-2a2 2 0 0 0-2 2v1"/><path d="M10 9.5V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v10"/><path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></symbol>
  </svg>
  <div class="frame" id="frame">
    <main id="app" class="console">
      <div class="padarea">
        <div class="pad" id="pad">
          <span class="conn" id="conn" title="Disconnected"></span>
          <span class="mic-dot" id="mic-dot" hidden><svg class="icon"><use href="#i-mic"/></svg>MIC</span>
          <button class="gear" id="gear" aria-label="Settings"><svg class="icon"><use href="#i-gear"/></svg></button>
        </div>
        <div class="strip" id="strip" aria-label="Scroll"><svg class="icon"><use href="#i-updown"/></svg></div>
      </div>
      <nav class="modes" id="modes">
        <button data-mode="trackpad" aria-label="Trackpad"><svg class="icon"><use href="#i-touchpad"/></svg><span>Trackpad</span></button>
        <button data-mode="keyboard" aria-label="Keys"><svg class="icon"><use href="#i-keyboard"/></svg><span>Keys</span></button>
        <button data-mode="media" aria-label="Media"><svg class="icon"><use href="#i-music"/></svg><span>Media</span></button>
        <button data-mode="presentation" aria-label="Present"><svg class="icon"><use href="#i-presentation"/></svg><span>Present</span></button>
      </nav>
      <section class="panel" id="panel"></section>
      <dialog class="sheet" id="sheet">
        <form method="dialog">
          <div class="grabber"></div>
          <header class="sheet-head">
            <h2>Settings</h2>
            <button class="done" value="done">Done</button>
          </header>
          <div class="sheet-body">
            <div id="settings"></div>
            <div class="group"><button type="button" class="row action" id="reset">Reset to Defaults</button></div>
            <div class="group"><button type="button" class="row action danger" id="unpair">Unpair this Remote</button></div>
          </div>
        </form>
      </dialog>
    </main>
  </div>
  <section class="pairing" id="pairing" hidden>
    <form id="pair-form">
      <div class="pair-glyph"><svg class="icon"><use href="#i-pointer"/></svg></div>
      <h1>Pair with your Mac</h1>
      <p>On the Mac, choose <b>Pair a Remote…</b> in the MyRemote menu and type the code it shows.</p>
      <p class="hint" id="pair-hint" hidden>Add the Remote to your Home Screen first, then pair there: Safari keeps its own pairing.</p>
      <label class="code">
        <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
        <input id="pair-code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" aria-label="Pairing code">
      </label>
      <p class="error" id="pair-error" role="alert"></p>
      <button id="pair-button">Pair</button>
    </form>
  </section>
  <script type="module" src="app.js"></script>
</body>
</html>
